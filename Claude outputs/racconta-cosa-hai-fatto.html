<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Bento — Racconta cosa hai fatto (concept, solo riferimento visivo)</title>
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;text-align:left;cursor:pointer}
@keyframes bentoPulse{0%,100%{opacity:1}50%{opacity:0.35}}
</style>
</head>
<body>

<div style="width:390px;height:844px;background:#F6F8FC;position:relative;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif">

  <!-- Sfondo: la home attenuata sotto il foglio -->
  <div style="position:absolute;inset:0;padding:30px 20px;opacity:0.55;filter:blur(1px)">
    <div style="font-size:12px;font-weight:700;letter-spacing:1px;color:#94A3B8;text-transform:uppercase">bento</div>
    <div style="font-size:26px;font-weight:800;color:#0F172A;letter-spacing:-0.3px;margin-top:3px">Ciao, Giando</div>
    <div style="margin-top:18px;border-radius:28px;height:128px;background:linear-gradient(135deg,#6D6AF8,#A98CF4,#F35BA6)"></div>
  </div>
  <div style="position:absolute;inset:0;background:rgba(15,23,42,0.5)"></div>

  <!-- Foglio: input in linguaggio naturale + conferma -->
  <div style="position:absolute;left:0;right:0;bottom:0;background:#ffffff;border-radius:28px 28px 0 0;padding:12px 20px 30px;box-shadow:0 -12px 32px rgba(15,23,42,0.22);display:flex;flex-direction:column;gap:16px;max-height:720px;overflow:auto">

    <div style="width:36px;height:4px;border-radius:999px;background:#E2E8F0;align-self:center"></div>

    <div style="display:flex;align-items:center;justify-content:space-between">
      <span style="font-size:17px;font-weight:800;color:#0F172A">Racconta cosa hai fatto</span>
      <button type="button" aria-label="Chiudi" style="all:unset;cursor:pointer;width:30px;height:30px;border-radius:999px;background:#F1F3F6;display:flex;align-items:center;justify-content:center;color:#64748B">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="5" y1="5" x2="19" y2="19"></line><line x1="19" y1="5" x2="5" y2="19"></line></svg>
      </button>
    </div>

    <!-- Trascrizione / testo inserito -->
    <div style="border-radius:20px;background:#0F172A;padding:16px 18px;display:flex;align-items:center;gap:12px">
      <span style="width:34px;height:34px;border-radius:999px;background:#6D6AF8;display:flex;align-items:center;justify-content:center;flex-shrink:0">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0"></path><line x1="12" y1="18" x2="12" y2="22"></line><line x1="8" y1="22" x2="16" y2="22"></line></svg>
      </span>
      <span style="flex:1;color:#ffffff;font-size:15px;font-weight:600;line-height:1.35">"Ho comprato il latte e speso 3,20&nbsp;€"</span>
      <span style="display:flex;align-items:flex-end;gap:2px;height:18px;flex-shrink:0">
        <span style="width:3px;height:7px;border-radius:2px;background:#A98CF4;animation:bentoPulse 1s ease-in-out infinite"></span>
        <span style="width:3px;height:14px;border-radius:2px;background:#A98CF4;animation:bentoPulse 1s ease-in-out 0.15s infinite"></span>
        <span style="width:3px;height:10px;border-radius:2px;background:#A98CF4;animation:bentoPulse 1s ease-in-out 0.3s infinite"></span>
        <span style="width:3px;height:16px;border-radius:2px;background:#A98CF4;animation:bentoPulse 1s ease-in-out 0.45s infinite"></span>
      </span>
    </div>

    <!-- Scorciatoie di frase: popolano il campo, non agiscono direttamente -->
    <div style="display:flex;gap:8px;overflow:auto">
      <button type="button" style="all:unset;cursor:pointer;flex-shrink:0;font-size:12.5px;font-weight:600;color:#3A4150;background:#F1F3F6;border-radius:999px;padding:8px 14px;white-space:nowrap">Ho pagato le bollette</button>
      <button type="button" style="all:unset;cursor:pointer;flex-shrink:0;font-size:12.5px;font-weight:600;color:#3A4150;background:#F1F3F6;border-radius:999px;padding:8px 14px;white-space:nowrap">Segna fatto: pulizie bagno</button>
      <button type="button" style="all:unset;cursor:pointer;flex-shrink:0;font-size:12.5px;font-weight:600;color:#3A4150;background:#F1F3F6;border-radius:999px;padding:8px 14px;white-space:nowrap">Ho preso il pane</button>
    </div>

    <!-- Interpretazione: l'AI capisce, il codice calcola -->
    <div style="display:flex;align-items:center;gap:6px;padding:0 2px">
      <svg viewBox="0 0 24 24" width="13" height="13" fill="#A98CF4" aria-hidden="true"><path d="M12 2l1.8 5.6L19.4 9.6 13.8 11.4 12 17 10.2 11.4 4.6 9.6 10.2 7.6z"></path></svg>
      <span style="font-size:12px;font-weight:600;color:#64748B">Capito — controlla prima di confermare</span>
    </div>

    <!-- Card di conferma: split e importo calcolati dal codice, mai dal modello -->
    <div style="border-radius:20px;background:#F8FAFC;border:1px solid #E2E8F0;padding:16px;display:flex;flex-direction:column;gap:12px">
      <div style="display:flex;align-items:center;gap:12px">
        <span style="width:38px;height:38px;border-radius:12px;background:#E3F6FC;display:flex;align-items:center;justify-content:center;color:#0E7490;flex-shrink:0">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="20" r="1"></circle><circle cx="18" cy="20" r="1"></circle><path d="M3 4h2l2.6 12.4a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L21 8H6"></path></svg>
        </span>
        <span style="flex:1">
          <span style="display:block;font-size:14.5px;font-weight:700;color:#0F172A">Nuova spesa</span>
          <span style="display:block;font-size:12px;font-weight:600;color:#64748B;margin-top:1px">Pagato da Giando · diviso in parti uguali</span>
        </span>
        <span style="font-size:19px;font-weight:800;color:#0F172A;flex-shrink:0">3,20&nbsp;€</span>
      </div>

      <div style="height:1px;background:#E2E8F0"></div>

      <div style="display:flex;flex-direction:column;gap:7px">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span style="font-size:13.5px;font-weight:600;color:#3A4150">Giando</span>
          <span style="font-size:13.5px;font-weight:700;color:#0F172A">1,60&nbsp;€</span>
        </div>
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span style="font-size:13.5px;font-weight:600;color:#3A4150">Vale</span>
          <span style="font-size:13.5px;font-weight:700;color:#0F172A">1,60&nbsp;€</span>
        </div>
      </div>

      <div style="display:flex;align-items:center;gap:8px;background:#EEF3FD;border-radius:12px;padding:9px 11px">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#2558BB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4" width="17" height="17" rx="4"></rect><path d="M8 12.5l2.2 2.2L16 9"></path></svg>
        <span style="font-size:12px;font-weight:600;color:#2558BB">"Latte" verrà segnato comprato nella lista spesa</span>
      </div>
    </div>

    <div style="display:flex;gap:10px">
      <button type="button" aria-label="Modifica i dettagli prima di confermare" style="all:unset;cursor:pointer;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;border:1.5px solid #E2E8F0;border-radius:16px;padding:13px 0;font-size:14.5px;font-weight:700;color:#3A4150">
        <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"></path><path d="M16.5 3.5a2.1 2.1 0 1 1 3 3L7 19l-4 1 1-4Z"></path></svg>
        Modifica
      </button>
      <button type="button" aria-label="Conferma e registra la spesa" style="all:unset;cursor:pointer;flex:2;display:flex;align-items:center;justify-content:center;gap:7px;background:#6D6AF8;border-radius:16px;padding:13px 0;font-size:14.5px;font-weight:700;color:#ffffff;box-shadow:0 10px 20px rgba(109,106,248,0.3)">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="4 12 9.5 18 20 6"></polyline></svg>
        Conferma spesa
      </button>
    </div>

  </div>

</div>
</body>
</html>
