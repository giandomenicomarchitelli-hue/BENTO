<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Bento — Homepage, i tuoi gruppi (il vassoio) (concept, solo riferimento visivo)</title>
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;text-align:left;cursor:pointer}
</style>
</head>
<body>

<div style="width:390px;height:844px;background:#F6F8FC;position:relative;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif">

  <div style="position:absolute;inset:0;overflow:auto;padding:30px 20px 36px;display:flex;flex-direction:column;gap:14px">

    <!-- Intestazione -->
    <div style="display:flex;align-items:flex-start;justify-content:space-between">
      <div>
        <div style="font-size:12px;font-weight:700;letter-spacing:1px;color:#94A3B8;text-transform:uppercase">bento</div>
        <div style="font-size:26px;font-weight:800;color:#0F172A;letter-spacing:-0.3px;margin-top:3px">Ciao, Giando</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <button type="button" aria-label="Apri profilo" style="all:unset;cursor:pointer;width:42px;height:42px;border-radius:14px;background:#ECEBFE;display:flex;align-items:center;justify-content:center">
          <span style="font-size:15px;font-weight:700;color:#5B55E8">G</span>
        </button>
        <button type="button" aria-label="Esci" style="all:unset;cursor:pointer;width:42px;height:42px;border-radius:14px;display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>

    <!-- Scomparto grande: panoramica dei tuoi gruppi -->
    <button type="button" aria-label="Apri i tuoi gruppi" style="all:unset;cursor:pointer;border-radius:28px;padding:22px;display:flex;flex-direction:column;gap:6px;background:linear-gradient(135deg,#6D6AF8,#A98CF4,#F35BA6);box-shadow:0 14px 28px rgba(109,106,248,0.3)">
      <span style="font-size:11px;font-weight:700;letter-spacing:0.8px;color:rgba(255,255,255,0.78);text-transform:uppercase">I tuoi spazi condivisi</span>
      <span style="font-size:33px;font-weight:800;color:#ffffff;letter-spacing:-0.4px;margin-top:2px">2</span>
      <span style="font-size:13px;color:rgba(255,255,255,0.88);font-weight:500;margin-top:1px">Casa, viaggi, ufficio e altro</span>
    </button>

    <!-- Scorciatoie -->
    <div style="display:flex;gap:14px">
      <button type="button" aria-label="Crea gruppo" style="all:unset;cursor:pointer;flex:1;min-height:122px;border-radius:24px;background:#E3FBF2;padding:18px;display:flex;flex-direction:column;justify-content:space-between">
        <span style="width:36px;height:36px;border-radius:11px;background:#CFF5E4;display:flex;align-items:center;justify-content:center;color:#0F9D71">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
        </span>
        <span style="display:block;font-size:14px;font-weight:700;color:#0F172A">Crea gruppo</span>
      </button>

      <button type="button" aria-label="Unisciti a un gruppo" style="all:unset;cursor:pointer;flex:1;min-height:122px;border-radius:24px;background:#E3F6FC;padding:18px;display:flex;flex-direction:column;justify-content:space-between">
        <span style="width:36px;height:36px;border-radius:11px;background:#CFEFFA;display:flex;align-items:center;justify-content:center;color:#0E7490">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M16 21v-1.6a3.6 3.6 0 0 0-3.6-3.6H6.6A3.6 3.6 0 0 0 3 19.4V21"/><circle cx="9.3" cy="7.6" r="3"/><line x1="19" y1="8" x2="19" y2="14"/><line x1="16" y1="11" x2="22" y2="11"/></svg>
        </span>
        <span style="display:block;font-size:14px;font-weight:700;color:#0F172A">Unisciti</span>
      </button>
    </div>

    <button type="button" aria-label="I miei saldi" style="all:unset;cursor:pointer;min-height:92px;border-radius:24px;background:#FFF6E0;padding:18px;display:flex;align-items:center;gap:14px">
      <span style="width:36px;height:36px;border-radius:11px;background:#FBEBC2;display:flex;align-items:center;justify-content:center;color:#B9780A;flex-shrink:0">
        <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>
      </span>
      <span style="font-size:14px;font-weight:700;color:#0F172A">I miei saldi</span>
    </button>

    <!-- I tuoi gruppi -->
    <div style="margin-top:6px;display:flex;flex-direction:column;gap:9px">
      <span style="font-size:12px;font-weight:700;letter-spacing:0.4px;color:#64748B;text-transform:uppercase;padding:0 2px">I tuoi gruppi</span>

      <button type="button" aria-label="Apri gruppo Casa Giando e Vale" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:18px;padding:14px 16px">
        <span style="width:30px;height:30px;border-radius:9px;background:#ECEBFE;display:flex;align-items:center;justify-content:center;color:#4C46D1;flex-shrink:0">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        </span>
        <span style="flex:1">
          <span style="display:block;font-size:14.5px;font-weight:700;color:#0F172A">Casa Giando &amp; Vale</span>
          <span style="display:block;font-size:12px;font-weight:600;color:#3A4150;margin-top:1px">2 persone · <span style="color:#2E7D32">ti devono 32,50 €</span></span>
        </span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
      </button>

      <button type="button" aria-label="Apri gruppo Viaggio a Napoli" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:18px;padding:14px 16px">
        <span style="width:30px;height:30px;border-radius:9px;background:#FDE7F1;display:flex;align-items:center;justify-content:center;color:#C2267F;flex-shrink:0">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        </span>
        <span style="flex:1">
          <span style="display:block;font-size:14.5px;font-weight:700;color:#0F172A">Viaggio a Napoli</span>
          <span style="display:block;font-size:12px;font-weight:600;color:#3A4150;margin-top:1px">3 persone · in pari</span>
        </span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
      </button>
    </div>

  </div>

</div>

</body>
</html>
