<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Bento — Profilo (il vassoio) (concept, solo riferimento visivo)</title>
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;text-align:left;cursor:pointer}
</style>
</head>
<body>

<div style="width:390px;height:844px;background:#F6F8FC;position:relative;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif">

  <div style="position:absolute;inset:0;overflow:auto;padding:26px 20px 36px;display:flex;flex-direction:column;gap:26px">

    <!-- Intestazione -->
    <div style="display:flex;align-items:center;gap:12px">
      <button type="button" aria-label="Torna indietro" style="all:unset;cursor:pointer;width:38px;height:38px;border-radius:13px;background:#ECEBFE;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#4C46D1">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div style="font-size:20px;font-weight:800;color:#0F172A;letter-spacing:-0.2px">Profilo</div>
    </div>

    <!-- Avatar grande + nome -->
    <div style="display:flex;flex-direction:column;align-items:center;gap:12px">
      <span style="width:76px;height:76px;border-radius:999px;background:linear-gradient(135deg,#6D6AF8,#A98CF4,#F35BA6);display:flex;align-items:center;justify-content:center;box-shadow:0 14px 28px rgba(109,106,248,0.3)">
        <span style="font-size:28px;font-weight:800;color:#ffffff">G</span>
      </span>
      <div style="display:flex;flex-direction:column;align-items:center;gap:4px">
        <span style="font-size:22px;font-weight:800;color:#0F172A">Giando</span>
        <span style="font-size:12.5px;font-weight:500;color:#94A3B8;text-align:center;max-width:260px">Fisso: è il nome con cui ti vedono gli altri in ogni gruppo.</span>
      </div>
    </div>

    <!-- Codice utente -->
    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:12px;font-weight:700;letter-spacing:0.4px;color:#64748B;text-transform:uppercase;padding:0 2px">Codice utente</span>
      <button type="button" aria-label="Copia codice utente" style="all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;background:#ECEBFE;border-radius:18px;padding:20px;text-align:center">
        <span style="font-size:24px;font-weight:800;letter-spacing:3px;color:#4C46D1">GN-4471</span>
      </button>
      <span style="font-size:12.5px;font-weight:500;color:#94A3B8;text-align:center">Tocca il codice per copiarlo</span>
    </div>

  </div>

</div>

</body>
</html>
