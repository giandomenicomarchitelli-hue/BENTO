<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Bento — Salda un debito (il vassoio) (concept, solo riferimento visivo)</title>
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;text-align:left;cursor:pointer}
input{font-family:inherit}
input::placeholder{color:#94A3B8}
</style>
</head>
<body>

<div style="width:390px;height:844px;background:#F6F8FC;position:relative;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif">

  <div style="position:absolute;inset:0;overflow:auto;padding:26px 20px 36px;display:flex;flex-direction:column;gap:20px">

    <!-- Intestazione -->
    <div style="display:flex;align-items:center;gap:12px">
      <button type="button" aria-label="Torna indietro" style="all:unset;cursor:pointer;width:38px;height:38px;border-radius:13px;background:#FFF6E0;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#B9780A">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div style="font-size:20px;font-weight:800;color:#0F172A;letter-spacing:-0.2px">Salda un debito</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:12px;font-weight:700;letter-spacing:0.4px;color:#64748B;text-transform:uppercase;padding:0 2px">Chi paga</span>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <button type="button" style="all:unset;cursor:pointer;padding:9px 16px;border-radius:999px;background:#6D6AF8;font-size:13px;font-weight:700;color:#ffffff">Vale</button>
        <button type="button" style="all:unset;cursor:pointer;padding:9px 16px;border-radius:999px;background:#F1F3F6;font-size:13px;font-weight:600;color:#3A4150">Giando</button>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:12px;font-weight:700;letter-spacing:0.4px;color:#64748B;text-transform:uppercase;padding:0 2px">A chi</span>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <button type="button" style="all:unset;cursor:pointer;padding:9px 16px;border-radius:999px;background:#6D6AF8;font-size:13px;font-weight:700;color:#ffffff">Giando</button>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:12px;font-weight:700;letter-spacing:0.4px;color:#64748B;text-transform:uppercase;padding:0 2px">Importo</span>
      <div style="display:flex;align-items:center;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:16px;padding:14px 18px">
        <input type="text" value="32,50" style="all:unset;flex:1;font-size:17px;color:#0F172A;font-weight:700">
        <span style="font-size:15px;color:#94A3B8;font-weight:600">€</span>
      </div>
      <span style="font-size:12.5px;font-weight:500;color:#94A3B8;padding:0 2px">Debito totale: 32,50 € — puoi saldarlo tutto o in parte</span>
    </div>

    <button type="button" style="all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;width:100%;box-sizing:border-box;background:#6D6AF8;border-radius:16px;padding:16px;font-size:15px;font-weight:700;color:#ffffff;box-shadow:0 10px 20px rgba(109,106,248,0.3);margin-top:4px">Registra pagamento</button>

  </div>

</div>

</body>
</html>
