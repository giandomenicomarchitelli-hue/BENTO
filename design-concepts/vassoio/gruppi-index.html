<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Bento — I miei gruppi (il vassoio) (concept, solo riferimento visivo)</title>
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;text-align:left;cursor:pointer}
</style>
</head>
<body>

<div style="width:390px;height:844px;background:#F6F8FC;position:relative;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif">

  <div style="position:absolute;inset:0;overflow:auto;padding:26px 20px 36px;display:flex;flex-direction:column;gap:18px">

    <!-- Intestazione -->
    <div style="display:flex;align-items:center;gap:12px">
      <button type="button" aria-label="Torna indietro" style="all:unset;cursor:pointer;width:38px;height:38px;border-radius:13px;background:#ECEBFE;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#4C46D1">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div style="font-size:20px;font-weight:800;color:#0F172A;letter-spacing:-0.2px">I miei gruppi</div>
    </div>

    <!-- Elenco -->
    <div style="display:flex;flex-direction:column;gap:9px">
      <button type="button" aria-label="Apri gruppo Casa Giando e Vale" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:18px;padding:14px 16px">
        <span style="width:30px;height:30px;border-radius:9px;background:#ECEBFE;display:flex;align-items:center;justify-content:center;color:#4C46D1;flex-shrink:0">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        </span>
        <span style="flex:1">
          <span style="display:block;font-size:14.5px;font-weight:700;color:#0F172A">Casa Giando &amp; Vale</span>
          <span style="display:block;font-size:11.5px;font-weight:700;letter-spacing:0.3px;color:#94A3B8;text-transform:uppercase;margin-top:2px">casa</span>
        </span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
      </button>

      <button type="button" aria-label="Apri gruppo Viaggio a Napoli" style="all:unset;cursor:pointer;display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:18px;padding:14px 16px">
        <span style="width:30px;height:30px;border-radius:9px;background:#FDE7F1;display:flex;align-items:center;justify-content:center;color:#C2267F;flex-shrink:0">
          <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9"/></svg>
        </span>
        <span style="flex:1">
          <span style="display:block;font-size:14.5px;font-weight:700;color:#0F172A">Viaggio a Napoli</span>
          <span style="display:block;font-size:11.5px;font-weight:700;letter-spacing:0.3px;color:#94A3B8;text-transform:uppercase;margin-top:2px">viaggio</span>
        </span>
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#94A3B8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 6 15 12 9 18"/></svg>
      </button>
    </div>

    <!-- Azioni -->
    <div style="display:flex;flex-direction:column;gap:10px;margin-top:4px">
      <button type="button" style="all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;width:100%;box-sizing:border-box;background:#6D6AF8;border-radius:16px;padding:16px;font-size:15px;font-weight:700;color:#ffffff;box-shadow:0 10px 20px rgba(109,106,248,0.3)">Crea un gruppo</button>
      <button type="button" style="all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;width:100%;box-sizing:border-box;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:16px;padding:16px;font-size:15px;font-weight:700;color:#6D6AF8">Ho un codice invito</button>
    </div>

  </div>

</div>

</body>
</html>
