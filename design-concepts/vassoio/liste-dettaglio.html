<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Bento — Dettaglio lista, Regali di Natale (il vassoio) (concept, solo riferimento visivo)</title>
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;text-align:left;cursor:pointer}
input{font-family:inherit}
input::placeholder{color:#94A3B8}
</style>
</head>
<body>

<div style="width:390px;height:844px;background:#F6F8FC;position:relative;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif">

  <div style="position:absolute;inset:0;overflow:auto;padding:26px 20px 36px;display:flex;flex-direction:column;gap:16px">

    <!-- Intestazione -->
    <div style="display:flex;align-items:center;gap:12px">
      <button type="button" aria-label="Torna indietro" style="all:unset;cursor:pointer;width:38px;height:38px;border-radius:13px;background:#FFF6E0;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#B9780A">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div style="font-size:20px;font-weight:800;color:#0F172A;letter-spacing:-0.2px">Regali di Natale</div>
    </div>

    <!-- Aggiungi voce: lista con prezzi, quindi anche la nota -->
    <div style="background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;gap:8px">
        <input type="text" placeholder="Aggiungi una voce" style="all:unset;flex:1;display:block;box-sizing:border-box;background:#F6F8FC;border-radius:14px;padding:11px 15px;font-size:14.5px;color:#0F172A;font-weight:500">
        <button type="button" aria-label="Aggiungi" style="all:unset;cursor:pointer;width:42px;height:42px;flex-shrink:0;border-radius:14px;background:#6D6AF8;display:flex;align-items:center;justify-content:center;box-shadow:0 8px 16px rgba(109,106,248,0.28)">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        </button>
      </div>
      <input type="text" placeholder="Note (opzionale)" style="all:unset;display:block;box-sizing:border-box;width:100%;background:#F6F8FC;border-radius:14px;padding:11px 15px;font-size:13.5px;color:#0F172A;font-weight:500">
    </div>

    <!-- Voci -->
    <div style="display:flex;flex-direction:column;gap:9px">

      <div style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:18px;padding:13px 16px">
        <span style="width:22px;height:22px;border-radius:7px;border:2px solid #CBD5E1;flex-shrink:0"></span>
        <span style="flex:1">
          <span style="display:block;font-size:15px;font-weight:600;color:#0F172A">Un regalo per Vale</span>
          <span style="display:block;font-size:12px;font-weight:600;color:#94A3B8;margin-top:1px">qualcosa di caldo</span>
        </span>
        <span style="font-size:13px;font-weight:700;color:#C0392B;flex-shrink:0">Elimina</span>
      </div>

      <div style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:18px;padding:13px 16px">
        <span style="width:22px;height:22px;border-radius:7px;border:2px solid #CBD5E1;flex-shrink:0"></span>
        <span style="flex:1;font-size:15px;font-weight:600;color:#0F172A">Decorazioni albero</span>
        <span style="font-size:13px;font-weight:700;color:#C0392B;flex-shrink:0">Elimina</span>
      </div>

      <!-- Voce fatta, su lista "con prezzi": si tocca l'icona per modificare/annullare, non la riga -->
      <div style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.45);border:1px solid rgba(148,163,184,0.14);border-radius:18px;padding:13px 16px">
        <span style="width:22px;height:22px;border-radius:7px;background:#6D6AF8;flex-shrink:0;display:flex;align-items:center;justify-content:center">
          <svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="20 6 9 17 4 12"/></svg>
        </span>
        <span style="flex:1;font-size:15px;font-weight:600;color:#94A3B8;text-decoration:line-through">Biglietti aerei andata</span>
        <button type="button" aria-label="Modifica o annulla acquisto" style="all:unset;cursor:pointer;padding:4px;flex-shrink:0;color:#94A3B8">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
        </button>
        <span style="font-size:13px;font-weight:700;color:#C0392B;flex-shrink:0">Elimina</span>
      </div>

    </div>

  </div>

</div>

</body>
</html>
