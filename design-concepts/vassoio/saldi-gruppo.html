<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Bento — Saldi e spese del gruppo (il vassoio) (concept, solo riferimento visivo)</title>
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;text-align:left;cursor:pointer}
</style>
</head>
<body>

<div style="width:390px;height:844px;background:#F6F8FC;position:relative;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif">

  <div style="position:absolute;inset:0;overflow:auto;padding:26px 20px 36px;display:flex;flex-direction:column;gap:18px">

    <!-- Intestazione -->
    <div style="display:flex;align-items:center;gap:12px">
      <button type="button" aria-label="Torna indietro" style="all:unset;cursor:pointer;width:38px;height:38px;border-radius:13px;background:#FFF6E0;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#B9780A">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div style="font-size:20px;font-weight:800;color:#0F172A;letter-spacing:-0.2px">Saldi e spese</div>
    </div>

    <!-- Due azioni -->
    <div style="display:flex;gap:10px">
      <button type="button" style="all:unset;cursor:pointer;flex:1;display:flex;align-items:center;justify-content:center;gap:6px;background:#6D6AF8;border-radius:16px;padding:13px;font-size:14px;font-weight:700;color:#ffffff;box-shadow:0 8px 16px rgba(109,106,248,0.28)">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
        Nuova spesa
      </button>
      <button type="button" style="all:unset;cursor:pointer;flex:1;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:16px;padding:13px;font-size:14px;font-weight:700;color:#6D6AF8">Salda un debito</button>
    </div>

    <!-- Saldi -->
    <div style="display:flex;flex-direction:column;gap:9px">
      <span style="font-size:12px;font-weight:700;letter-spacing:0.4px;color:#64748B;text-transform:uppercase;padding:0 2px">Saldi</span>

      <div style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:18px;padding:13px 16px">
        <span style="width:34px;height:34px;border-radius:999px;background:#F35BA6;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <span style="font-size:13px;font-weight:700;color:#ffffff">V</span>
        </span>
        <span style="flex:1;font-size:14.5px;color:#0F172A"><span style="font-weight:700">Vale</span> deve a <span style="font-weight:700">Giando</span></span>
        <span style="font-size:15px;font-weight:800;color:#C0392B">32,50 €</span>
        <button type="button" style="all:unset;cursor:pointer;font-size:13px;font-weight:700;color:#6D6AF8;flex-shrink:0">Salda</button>
      </div>
    </div>

    <!-- Spese -->
    <div style="display:flex;flex-direction:column;gap:9px">
      <span style="font-size:12px;font-weight:700;letter-spacing:0.4px;color:#64748B;text-transform:uppercase;padding:0 2px">Spese</span>

      <div style="display:flex;flex-direction:column;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:18px;overflow:hidden">
        <div style="display:flex;align-items:center;gap:12px;padding:13px 16px">
          <span style="width:34px;height:34px;border-radius:999px;background:#F35BA6;display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <span style="font-size:13px;font-weight:700;color:#ffffff">V</span>
          </span>
          <span style="flex:1">
            <span style="display:block;font-size:14.5px;font-weight:700;color:#0F172A">Spesa settimanale</span>
            <span style="display:block;font-size:12px;font-weight:600;color:#94A3B8;margin-top:1px">Vale · 10 ott</span>
          </span>
          <span style="font-size:14.5px;font-weight:700;color:#0F172A">45,00 €</span>
          <button type="button" aria-label="Annulla spesa" style="all:unset;cursor:pointer;padding:4px;flex-shrink:0;color:#CBD5E1">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
        <div style="height:1px;background:rgba(148,163,184,0.18)"></div>
        <div style="display:flex;align-items:center;gap:12px;padding:13px 16px">
          <span style="width:34px;height:34px;border-radius:999px;background:#6D6AF8;display:flex;align-items:center;justify-content:center;flex-shrink:0">
            <span style="font-size:13px;font-weight:700;color:#ffffff">G</span>
          </span>
          <span style="flex:1">
            <span style="display:block;font-size:14.5px;font-weight:700;color:#0F172A">Detersivi</span>
            <span style="display:block;font-size:12px;font-weight:600;color:#94A3B8;margin-top:1px">Giando · 8 ott</span>
          </span>
          <span style="font-size:14.5px;font-weight:700;color:#0F172A">12,30 €</span>
          <button type="button" aria-label="Annulla spesa" style="all:unset;cursor:pointer;padding:4px;flex-shrink:0;color:#CBD5E1">
            <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>
    </div>

  </div>

</div>

</body>
</html>
