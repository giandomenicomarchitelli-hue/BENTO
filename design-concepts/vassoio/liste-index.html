<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Bento — Liste (il vassoio) (concept, solo riferimento visivo)</title>
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;text-align:left;cursor:pointer}
input{font-family:inherit}
input::placeholder{color:#94A3B8}
</style>
</head>
<body>

<div style="width:390px;height:844px;background:#F6F8FC;position:relative;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif">

  <div style="position:absolute;inset:0;overflow:auto;padding:26px 20px 36px;display:flex;flex-direction:column;gap:18px">

    <!-- Intestazione -->
    <div style="display:flex;align-items:center;gap:12px">
      <button type="button" aria-label="Torna indietro" style="all:unset;cursor:pointer;width:38px;height:38px;border-radius:13px;background:#FFF6E0;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#B9780A">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div style="font-size:20px;font-weight:800;color:#0F172A;letter-spacing:-0.2px">Liste</div>
    </div>

    <!-- Nuova lista -->
    <div style="background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:22px;padding:16px;display:flex;flex-direction:column;gap:10px">
      <input type="text" placeholder="Nuova lista (es. Film da vedere)" style="all:unset;display:block;box-sizing:border-box;width:100%;background:#F6F8FC;border-radius:14px;padding:12px 15px;font-size:14.5px;color:#0F172A;font-weight:500">
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <button type="button" style="all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;background:#F1F3F6;font-size:12px;font-weight:600;color:#3A4150">Mostra anche in home</button>
        <button type="button" style="all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;background:#F1F3F6;font-size:12px;font-weight:600;color:#3A4150">Lista con prezzi (collegata ai saldi)</button>
      </div>
      <button type="button" style="all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;width:100%;box-sizing:border-box;background:#6D6AF8;border-radius:14px;padding:13px;font-size:14.5px;font-weight:700;color:#ffffff;box-shadow:0 8px 16px rgba(109,106,248,0.28);margin-top:2px">Crea lista</button>
    </div>

    <!-- Liste esistenti -->
    <div style="display:flex;flex-direction:column;gap:9px">
      <button type="button" aria-label="Apri lista Spesa settimanale" style="all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:18px;padding:14px 16px">
        <span>
          <span style="display:block;font-size:15px;font-weight:700;color:#0F172A">Spesa settimanale</span>
          <span style="display:block;font-size:11.5px;font-weight:700;letter-spacing:0.3px;color:#94A3B8;text-transform:uppercase;margin-top:2px">in home</span>
        </span>
        <span style="font-size:13px;font-weight:700;color:#C0392B;flex-shrink:0">Elimina</span>
      </button>

      <button type="button" aria-label="Apri lista Film da vedere" style="all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:18px;padding:14px 16px">
        <span style="font-size:15px;font-weight:700;color:#0F172A">Film da vedere</span>
        <span style="font-size:13px;font-weight:700;color:#C0392B;flex-shrink:0">Elimina</span>
      </button>

      <button type="button" aria-label="Apri lista Regali di Natale" style="all:unset;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:12px;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:18px;padding:14px 16px">
        <span>
          <span style="display:block;font-size:15px;font-weight:700;color:#0F172A">Regali di Natale</span>
          <span style="display:block;font-size:11.5px;font-weight:700;letter-spacing:0.3px;color:#94A3B8;text-transform:uppercase;margin-top:2px">con prezzi</span>
        </span>
        <span style="font-size:13px;font-weight:700;color:#C0392B;flex-shrink:0">Elimina</span>
      </button>
    </div>

  </div>

</div>

</body>
</html>
