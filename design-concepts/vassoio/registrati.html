<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Bento — Crea un account (il vassoio) (concept, solo riferimento visivo)</title>
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;text-align:left;cursor:pointer}
input{font-family:inherit}
input::placeholder{color:#94A3B8}
</style>
</head>
<body>

<div style="width:390px;height:844px;background:#F6F8FC;position:relative;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif">

  <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 28px;gap:30px">

    <div style="display:flex;flex-direction:column;gap:8px;align-items:center">
      <div style="font-size:12px;font-weight:700;letter-spacing:1px;color:#94A3B8;text-transform:uppercase">bento</div>
      <div style="font-size:27px;font-weight:800;color:#0F172A;letter-spacing:-0.3px;text-align:center">Crea un account</div>
    </div>

    <div style="display:flex;flex-direction:column;gap:12px">
      <input type="email" placeholder="Email" style="all:unset;display:block;box-sizing:border-box;width:100%;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:18px;padding:15px 18px;font-size:15.5px;color:#0F172A;font-weight:500">
      <input type="password" placeholder="Password" style="all:unset;display:block;box-sizing:border-box;width:100%;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:18px;padding:15px 18px;font-size:15.5px;color:#0F172A;font-weight:500">
      <input type="password" placeholder="Conferma password" style="all:unset;display:block;box-sizing:border-box;width:100%;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:18px;padding:15px 18px;font-size:15.5px;color:#0F172A;font-weight:500">
    </div>

    <div style="display:flex;flex-direction:column;gap:16px">
      <button type="button" style="all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;width:100%;box-sizing:border-box;background:#6D6AF8;border-radius:16px;padding:16px;font-size:15.5px;font-weight:700;color:#ffffff;box-shadow:0 10px 20px rgba(109,106,248,0.3)">Crea account</button>
      <button type="button" style="all:unset;cursor:pointer;display:block;width:100%;text-align:center;font-size:14px;font-weight:600;color:#6D6AF8">Hai già un account? Accedi</button>
    </div>

  </div>

</div>

</body>
</html>
