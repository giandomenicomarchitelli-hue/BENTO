<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Bento — Impostazioni gruppo (il vassoio) (concept, solo riferimento visivo)</title>
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;text-align:left;cursor:pointer}
</style>
</head>
<body>

<div style="width:390px;height:844px;background:#F6F8FC;position:relative;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif">

  <div style="position:absolute;inset:0;overflow:auto;padding:26px 20px 36px;display:flex;flex-direction:column;gap:22px">

    <!-- Intestazione -->
    <div style="display:flex;align-items:center;gap:12px">
      <button type="button" aria-label="Torna indietro" style="all:unset;cursor:pointer;width:38px;height:38px;border-radius:13px;background:#ECEBFE;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#4C46D1">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div style="flex:1;display:flex;align-items:center;justify-content:space-between;gap:10px">
        <span style="font-size:20px;font-weight:800;color:#0F172A;letter-spacing:-0.2px">Casa Giando &amp; Vale</span>
        <button type="button" style="all:unset;cursor:pointer;font-size:13px;font-weight:700;color:#6D6AF8;flex-shrink:0">Modifica</button>
      </div>
    </div>

    <!-- Codice invito -->
    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:12px;font-weight:700;letter-spacing:0.4px;color:#64748B;text-transform:uppercase;padding:0 2px">Codice invito</span>
      <button type="button" aria-label="Copia codice invito" style="all:unset;cursor:pointer;display:block;width:100%;box-sizing:border-box;background:#ECEBFE;border-radius:18px;padding:20px;text-align:center">
        <span style="font-size:27px;font-weight:800;letter-spacing:4px;color:#4C46D1">7K2N9Q</span>
      </button>
      <span style="font-size:12.5px;font-weight:500;color:#94A3B8;text-align:center">Tocca il codice per copiarlo</span>

      <button type="button" style="all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;background:#6D6AF8;border-radius:16px;padding:15px;font-size:14.5px;font-weight:700;color:#ffffff;box-shadow:0 10px 20px rgba(109,106,248,0.3);margin-top:4px">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.6" y1="10.6" x2="15.4" y2="6.4"/><line x1="8.6" y1="13.4" x2="15.4" y2="17.6"/></svg>
        Condividi invito
      </button>
    </div>

    <!-- Membri -->
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:0 2px">
        <span style="font-size:12px;font-weight:700;letter-spacing:0.4px;color:#64748B;text-transform:uppercase">Membri</span>
        <span style="background:#ECEBFE;color:#4C46D1;font-size:12px;font-weight:800;border-radius:999px;padding:3px 10px">2</span>
      </div>

      <div style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:18px;padding:12px 16px">
        <span style="width:36px;height:36px;border-radius:999px;background:#6D6AF8;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <span style="font-size:14px;font-weight:700;color:#ffffff">G</span>
        </span>
        <span style="font-size:15px;font-weight:600;color:#0F172A">Giando (tu)</span>
      </div>
      <div style="display:flex;align-items:center;gap:12px;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:18px;padding:12px 16px">
        <span style="width:36px;height:36px;border-radius:999px;background:#F35BA6;display:flex;align-items:center;justify-content:center;flex-shrink:0">
          <span style="font-size:14px;font-weight:700;color:#ffffff">V</span>
        </span>
        <span style="font-size:15px;font-weight:600;color:#0F172A">Vale</span>
      </div>
    </div>

    <button type="button" style="all:unset;cursor:pointer;align-self:center;font-size:14.5px;font-weight:700;color:#C0392B;margin-top:6px">Esci dal gruppo</button>

  </div>

</div>

</body>
</html>
