<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Bento — Unisciti a un gruppo (il vassoio) (concept, solo riferimento visivo)</title>
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;text-align:left;cursor:pointer}
input{font-family:inherit}
input::placeholder{color:#94A3B8}
</style>
</head>
<body>

<div style="width:390px;height:844px;background:#F6F8FC;position:relative;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif">

  <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;padding:0 28px;gap:26px">

    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="font-size:12px;font-weight:700;letter-spacing:1px;color:#94A3B8;text-transform:uppercase;text-align:center">bento</div>
      <div style="font-size:26px;font-weight:800;color:#0F172A;letter-spacing:-0.3px;text-align:center">Unisciti a un gruppo</div>
      <div style="font-size:14px;color:#3A4150;text-align:center;line-height:1.45;font-weight:500">Chiedi il codice invito a chi è già nel gruppo.</div>
    </div>

    <input type="text" placeholder="Codice invito" style="all:unset;display:block;box-sizing:border-box;width:100%;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:18px;padding:15px 18px;font-size:15.5px;color:#0F172A;font-weight:500;letter-spacing:0.5px">

    <button type="button" style="all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;width:100%;box-sizing:border-box;background:#6D6AF8;border-radius:16px;padding:16px;font-size:15.5px;font-weight:700;color:#ffffff;box-shadow:0 10px 20px rgba(109,106,248,0.3)">Unisciti</button>

  </div>

</div>

</body>
</html>
