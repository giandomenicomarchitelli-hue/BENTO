<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Bento — Registra spesa, form manuale (il vassoio) (concept, solo riferimento visivo)</title>
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;text-align:left;cursor:pointer}
input{font-family:inherit}
input::placeholder{color:#94A3B8}
</style>
</head>
<body>

<div style="width:390px;height:844px;background:#F6F8FC;position:relative;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif">

  <div style="position:absolute;inset:0;overflow:auto;padding:26px 20px 36px;display:flex;flex-direction:column;gap:18px">

    <!-- Intestazione: qui nel caso "arrivo dalla lista della spesa", che è lo stato più ricco -->
    <div style="display:flex;align-items:center;gap:12px">
      <button type="button" aria-label="Torna indietro" style="all:unset;cursor:pointer;width:38px;height:38px;border-radius:13px;background:#ECEBFE;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#4C46D1">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div style="font-size:20px;font-weight:800;color:#0F172A;letter-spacing:-0.2px">Registra spesa</div>
    </div>

    <!-- Hint: presente solo se si arriva da un articolo della lista della spesa -->
    <div style="background:#ECEBFE;border-radius:16px;padding:13px 16px">
      <span style="font-size:13.5px;font-weight:600;color:#4C46D1">Hai segnato «Latte»: quanto hai pagato?</span>
    </div>

    <div style="display:flex;flex-direction:column;gap:10px">
      <div style="display:flex;align-items:center;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:16px;padding:14px 18px">
        <input type="text" placeholder="Importo (es. 12,50)" style="all:unset;flex:1;font-size:17px;color:#0F172A;font-weight:700">
        <span style="font-size:15px;color:#94A3B8;font-weight:600">€</span>
      </div>
      <input type="text" value="Latte" placeholder="Descrizione (opzionale)" style="all:unset;display:block;box-sizing:border-box;width:100%;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:16px;padding:14px 18px;font-size:15px;color:#0F172A;font-weight:600">
      <input type="text" placeholder="Note (opzionale, es. marca)" style="all:unset;display:block;box-sizing:border-box;width:100%;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:16px;padding:14px 18px;font-size:14px;color:#0F172A;font-weight:500">
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:12px;font-weight:700;letter-spacing:0.4px;color:#64748B;text-transform:uppercase;padding:0 2px">Pagato da</span>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <button type="button" style="all:unset;cursor:pointer;padding:9px 16px;border-radius:999px;background:#6D6AF8;font-size:13px;font-weight:700;color:#ffffff">Giando</button>
        <button type="button" style="all:unset;cursor:pointer;padding:9px 16px;border-radius:999px;background:#F1F3F6;font-size:13px;font-weight:600;color:#3A4150">Vale</button>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <span style="font-size:12px;font-weight:700;letter-spacing:0.4px;color:#64748B;text-transform:uppercase;padding:0 2px">Diviso tra</span>
      <div style="display:flex;flex-wrap:wrap;gap:8px">
        <button type="button" style="all:unset;cursor:pointer;padding:9px 16px;border-radius:999px;background:#6D6AF8;font-size:13px;font-weight:700;color:#ffffff">Giando</button>
        <button type="button" style="all:unset;cursor:pointer;padding:9px 16px;border-radius:999px;background:#6D6AF8;font-size:13px;font-weight:700;color:#ffffff">Vale</button>
      </div>
    </div>

    <button type="button" style="all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;width:100%;box-sizing:border-box;background:#6D6AF8;border-radius:16px;padding:16px;font-size:15px;font-weight:700;color:#ffffff;box-shadow:0 10px 20px rgba(109,106,248,0.3);margin-top:4px">Registra spesa</button>

    <button type="button" style="all:unset;cursor:pointer;align-self:center;font-size:13px;font-weight:600;color:#64748B">Segna fatto senza registrare la spesa</button>

  </div>

</div>

</body>
</html>
