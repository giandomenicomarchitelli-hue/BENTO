<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Bento — Saldo con Vale (il vassoio) (concept, solo riferimento visivo)</title>
<style>
body{margin:0}
*{box-sizing:border-box}
button{font-family:inherit;text-align:left;cursor:pointer}
</style>
</head>
<body>

<div style="width:390px;height:844px;background:#F6F8FC;position:relative;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif">

  <div style="position:absolute;inset:0;overflow:auto;padding:26px 20px 36px;display:flex;flex-direction:column;gap:22px">

    <!-- Intestazione -->
    <div style="display:flex;align-items:center;gap:12px">
      <button type="button" aria-label="Torna indietro" style="all:unset;cursor:pointer;width:38px;height:38px;border-radius:13px;background:#FFF6E0;display:flex;align-items:center;justify-content:center;flex-shrink:0;color:#B9780A">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <div style="font-size:20px;font-weight:800;color:#0F172A;letter-spacing:-0.2px">Vale</div>
    </div>

    <!-- Saldo netto, in evidenza come lo scomparto grande di Home -->
    <div style="border-radius:28px;padding:24px;display:flex;flex-direction:column;align-items:center;gap:4px;background:linear-gradient(135deg,#6D6AF8,#A98CF4,#F35BA6);box-shadow:0 14px 28px rgba(109,106,248,0.3)">
      <span style="font-size:11px;font-weight:700;letter-spacing:0.8px;color:rgba(255,255,255,0.78);text-transform:uppercase">Vale ti deve</span>
      <span style="font-size:36px;font-weight:800;color:#ffffff;letter-spacing:-0.4px;margin-top:2px">32,50 €</span>
    </div>

    <!-- Nei singoli gruppi -->
    <div style="display:flex;flex-direction:column;gap:9px">
      <span style="font-size:12px;font-weight:700;letter-spacing:0.4px;color:#64748B;text-transform:uppercase;padding:0 2px">Nei singoli gruppi</span>
      <div style="display:flex;align-items:center;justify-content:space-between;background:rgba(255,255,255,0.72);border:1px solid rgba(148,163,184,0.18);border-radius:18px;padding:14px 16px">
        <span style="font-size:14.5px;font-weight:700;color:#0F172A">Casa Giando &amp; Vale</span>
        <span style="font-size:14.5px;font-weight:800;color:#2E7D32">ti deve 32,50 €</span>
      </div>
    </div>

    <button type="button" style="all:unset;cursor:pointer;display:flex;align-items:center;justify-content:center;width:100%;box-sizing:border-box;background:#6D6AF8;border-radius:16px;padding:16px;font-size:15px;font-weight:700;color:#ffffff;box-shadow:0 10px 20px rgba(109,106,248,0.3);margin-top:4px">Salda tutto</button>
    <span style="font-size:12px;font-weight:500;color:#94A3B8;text-align:center;line-height:1.4">Azzera il saldo in ogni gruppo in comune. Per saldare solo in parte, o solo un gruppo specifico, usa «Salda un debito» dentro al singolo gruppo.</span>

  </div>

</div>

</body>
</html>
